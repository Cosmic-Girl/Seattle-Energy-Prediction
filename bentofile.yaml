service: "api.service:SeattleEnergyService"

description: |
  API de prédiction de la consommation énergétique annuelle
  des bâtiments non résidentiels de Seattle.

  Le modèle exposé est une Random Forest optimisée.
  Les données d'entrée sont validées avec Pydantic avant l'inférence.

  Endpoint principal : POST /predict

include:
  - "api/service.py"
  - "api/schemas.py"

models:
  - "seattle_energy_model:vekvkwfo2cew7an6"

python:
  packages:
    - "bentoml==1.4.39"
    - "scikit-learn==1.9.0"
    - "pandas==3.0.5"
    - "pydantic==2.13.4"

docker:
  python_version: "3.11"